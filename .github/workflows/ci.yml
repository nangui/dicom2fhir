name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit SHA (supply chain), tag in comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (reads packageManager)
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Every commit of a PR must pass on its own: keeps `git bisect` and reverts usable.
  commits:
    name: Each commit passes alone
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in $(git rev-list --reverse "$BASE_SHA..$HEAD_SHA"); do
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            git checkout --quiet "$sha"
            pnpm install --frozen-lockfile
            pnpm lint
            pnpm typecheck
            pnpm test
            echo "::endgroup::"
          done

  # The real validator in a container: the CI runner has the RAM the dev VM lacks.
  validator:
    name: HAPI validator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start HAPI (compose profile, Java healthcheck)
        run: docker compose --profile validator up -d --wait --wait-timeout 420 hapi
      - name: Smoke test $validate
        env:
          VALIDATOR_URL: http://localhost:8080/fhir
        run: scripts/validator-smoke.sh
      - name: HAPI logs on failure
        if: failure()
        run: docker compose --profile validator logs --tail 200 hapi
